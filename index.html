<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        try {
          var h = window.location.hostname;
          if (h && h.endsWith('.vercel.app') && h !== 'between-us-seven-kappa.vercel.app') {
            window.location.replace('https://between-us-seven-kappa.vercel.app' + window.location.pathname + window.location.search + window.location.hash);
          }
        } catch(e) {}
      })();
    </script>
    <title>BetweenUs - Long-Distance Relationship Companion</title>
    <meta name="description" content="A private, warm, and secure digital sanctuary for long-distance couples to chat, share moods, track distance, plan virtual dates, and cherish memories together." />
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="BetweenUs - Long-Distance Relationship Companion" />
    <meta property="og:description" content="A private, warm, and secure digital sanctuary for long-distance couples to chat, share moods, track distance, plan virtual dates, and cherish memories together." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#f43f5e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BetweenUs" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="BetweenUs" />
    <link rel="preload" as="image" href="/home-bg.jpg" />

    <!-- Google Fonts for warm, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-rose-50/40 text-slate-800 antialiased selection:bg-rose-200 selection:text-rose-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
